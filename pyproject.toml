[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ApexNav"
version = "0.1"
authors = [{name = "Zager-Zhang"}]
description = "ApexNav ROS2 with YOLOE segmentation and CLIP scene similarity"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy == 1.26.4",
    "numba == 0.60.0",
    "numpy-quaternion",
    "pillow == 10.4.0",
    "scipy == 1.13.1",
    "matplotlib == 3.9.2",
    "opencv-python == 4.10.0.84",
    "open3d == 0.19.0",
    "hydra-core == 1.3.2",
    "omegaconf == 2.3.0",
    "gym == 0.23.0",
    "imageio",
    "imageio-ffmpeg",
    "moviepy == 1.0.3",
    "prettytable >= 3.12.0",
    "tqdm",
    "seaborn == 0.13.2",
    "requests",
    "attrs",
    "gitpython",
    "transforms3d",
    "openai >= 1.58.1",
    "ollama",
]

[project.optional-dependencies]
vision = [
    "torch == 2.5.1",
    "torchvision == 0.20.1",
    "flask == 3.0.3",
    "ultralytics == 8.3.209",
    "clip @ git+https://github.com/ultralytics/CLIP.git",
]
dev = ["pytest >= 7.2.1", "pytest-cov >= 4.0.0"]

[tool.setuptools.packages.find]
include = ["basic_utils*", "habitat2ros*", "llm*", "vlm*"]
