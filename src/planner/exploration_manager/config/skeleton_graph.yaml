/**:
  ros__parameters:
    skeleton_graph:
      enabled: false                 # Enable with simulation.launch.py skeleton:=true
      update_hz: 1.0                 # Maximum snapshot polling/rebuild submission rate
      change_tile_size: 32           # Pixels per fingerprint tile, NOT a second map
      min_changed_tiles: 1           # Rebuild after this many changed tiles
      min_changed_ratio: 0.0         # Optional OR ratio of all tiles; 0 disables ratio test
      min_island_area: 1.0           # m^2; discard smaller isolated FREE regions, retain largest; 0 disables
      min_branch_length: 1.0        # Metres; 0 disables length pruning only
      unknown_boundary_distance: 0.50 # Metadata only; no pruning protection
      min_deadend_width: 0.30       # Metres; max 2*clearance on terminal part; 0 disables width pruning
      deadend_width_sample_fraction: 0.50 # Arc-length fraction from Endpoint; (0,1]
      remove_deadends: false        # Remove formal one-neighbor Endpoint and its branch
      connect_frontiers: true        # Current active/dormant Frontier -> nearest reachable Junction
      frontier_max_association_distance: 0.50 # Metres; bound safe approach -> unchanged centroid
      frontier_association_dash_length: 0.04 # Metres per orange visual dash (not a traversable edge)
      node_match_distance: 0.40      # Metres; same node type, nearest one-to-one match
      junction_merge_length: 0.50    # Metres; direct Junction-Junction edge < threshold; average original positions; 0 disables
      visit_radius: 0.50            # Metres; Junction confirmation uses robot base odometry, not camera visibility
      visit_odom_timeout: 1.0        # Seconds; ignore stale/wrong-frame or pre-reset odometry
      visualization_z: 0.12
      frontier_visualization_z: 0.36 # Match existing Frontier sphere/cube centres
      node_scale: 0.16
      edge_width: 0.035
      label_scale: 0.14
      show_node_ids: true
